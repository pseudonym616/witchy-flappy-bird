<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Witchy Flap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1e7fa;
    --frame: #dcc6f0;
    --muted: #6b5a80;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0718;
      --frame: #2a1640;
      --muted: #a995c4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0718;
    --frame: #2a1640;
    --muted: #a995c4;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px;
  }
  canvas {
    display: block;
    width: min(400px, calc(100vw - 24px), calc((100vh - 90px) * 2 / 3));
    width: min(400px, calc(100vw - 24px), calc((100svh - 90px) * 2 / 3));
    height: auto;
    aspect-ratio: 2 / 3;
    border-radius: 18px;
    box-shadow: 0 0 0 3px var(--frame), 0 14px 40px rgba(40, 10, 70, 0.45);
    touch-action: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hint { margin: 0; font-weight: 700; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" aria-label="Witchy Flap game"></canvas>
  <p class="hint">Space, click or tap to fly</p>
</div>
<script>
(() => {
  // ---------- Setup ----------
  const W = 400, H = 600, GROUND = H - 64;
  const GRAVITY = 0.38, FLAP = -7.2, MAX_FALL = 9.5;
  const PIPE_W = 62, GAP = 165, SPEED = 2.3, SPACING = 215, CAP_H = 44;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = W * dpr;
  canvas.height = H * dpr;

  const TITLE_FONT = 'Creepster, Impact, fantasy';
  const BODY_FONT = 'Nunito, system-ui, sans-serif';

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const TAU = Math.PI * 2;

  function loadBest() {
    try { return parseInt(localStorage.getItem('witchyflap-best') || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('witchyflap-best', String(v)); } catch (e) {}
  }

  // ---------- State ----------
  let state = 'ready'; // ready | playing | over
  let t = 0;
  const witch = { x: 110, y: 270, vy: 0, r: 14, angle: 0 };
  let pipes = [], score = 0, best = loadBest(), newBest = false, dist = 0;
  let farOff = 0, nearOff = 0, groundOff = 0;
  let particles = [], scorePop = 0, flash = 0, shake = 0, overAt = 0;

  const stars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, 330), r: rand(0.5, 1.7), p: rand(0, TAU), ch: Math.random() < 0.5 ? '0' : '1' }));
  const bats = Array.from({ length: 3 }, () => ({ x: rand(0, W), y: rand(60, 220), s: rand(0.45, 0.8), v: rand(0.4, 0.9), p: rand(0, TAU) }));

  const MID_TILE = 520;
  const midPumpkins = [
    { x: 30, s: 0.9, lit: true }, { x: 120, s: 0.6, lit: false }, { x: 210, s: 1.1, lit: true },
    { x: 300, s: 0.7, lit: true }, { x: 385, s: 0.55, lit: false }, { x: 455, s: 1.0, lit: true }
  ];
  const FG_TILE = 360;
  const fgPumpkins = [{ x: 40, s: 1, lit: true }, { x: 190, s: 0.75, lit: false }, { x: 290, s: 1.15, lit: true }];

  const farHill = x => { const w = x + farOff; return 400 + Math.sin(w * 0.011) * 20 + Math.sin(w * 0.027) * 9; };
  const nearHill = x => { const w = x + nearOff; return 458 + Math.sin(w * 0.008 + 1) * 16 + Math.sin(w * 0.021) * 7; };

  function reset() {
    witch.y = 270; witch.vy = 0; witch.angle = 0;
    pipes = []; score = 0; newBest = false; dist = SPACING; particles = [];
  }

  function broomTail() {
    const a = witch.angle;
    return { x: witch.x + (-36 * Math.cos(a) - 9 * Math.sin(a)), y: witch.y + (-36 * Math.sin(a) + 9 * Math.cos(a)) };
  }

  function spark(x, y, vx, vy, colors) {
    particles.push({ x, y, vx, vy, life: 0, max: rand(25, 45), c: pick(colors || ['#c77dff', '#9dff6b', '#ffd54a']), s: rand(1.5, 3.2) });
  }

  function flap() {
    if (state === 'over') {
      if (performance.now() - overAt < 600) return;
      reset();
      state = 'playing';
    } else if (state === 'ready') {
      state = 'playing';
    }
    witch.vy = FLAP;
    const b = broomTail();
    for (let i = 0; i < 8; i++) spark(b.x, b.y, rand(-3, -0.5), rand(-1.5, 1.5));
  }

  function die() {
    state = 'over';
    overAt = performance.now();
    flash = 1; shake = 9;
    if (score > best) { best = score; newBest = true; saveBest(best); }
    for (let i = 0; i < 22; i++) spark(witch.x, witch.y, rand(-3, 3), rand(-3, 2), ['#ff8a1f', '#ffd54a', '#c77dff']);
  }

  function hitRect(rx, ry, rw, rh) {
    const cx = Math.max(rx, Math.min(witch.x, rx + rw));
    const cy = Math.max(ry, Math.min(witch.y, ry + rh));
    const dx = witch.x - cx, dy = witch.y - cy, r = witch.r * 0.85;
    return dx * dx + dy * dy < r * r;
  }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    if (state !== 'over') {
      farOff += SPEED * 0.2 * dt;
      nearOff += SPEED * 0.45 * dt;
      groundOff += SPEED * dt;
    }
    bats.forEach(b => {
      b.x -= b.v * dt; b.p += 0.25 * dt;
      if (b.x < -30) { b.x = W + 30; b.y = rand(60, 220); }
    });

    if (state === 'ready') {
      witch.y = 270 + Math.sin(t * 0.08) * 8;
      witch.angle = Math.sin(t * 0.08) * 0.08;
      if (Math.random() < 0.3 * dt) { const b = broomTail(); spark(b.x, b.y, rand(-1.5, -0.3), rand(-0.4, 0.4)); }
    } else if (state === 'playing') {
      witch.vy = Math.min(witch.vy + GRAVITY * dt, MAX_FALL);
      witch.y += witch.vy * dt;
      const target = Math.max(-0.45, Math.min(1.1, witch.vy * 0.09));
      witch.angle += (target - witch.angle) * Math.min(1, 0.2 * dt);
      if (witch.y < witch.r) { witch.y = witch.r; witch.vy = 0; }

      dist += SPEED * dt;
      if (dist >= SPACING) {
        dist -= SPACING;
        const minTop = 50, maxTop = GROUND - GAP - 50;
        const last = pipes[pipes.length - 1];
        let top = rand(minTop, maxTop);
        if (last) top = Math.max(minTop, Math.min(maxTop, last.top + rand(-160, 160)));
        pipes.push({ x: W + 10, top, scored: false, seed: Math.random() });
      }
      pipes.forEach(p => { p.x -= SPEED * dt; });
      pipes = pipes.filter(p => p.x + PIPE_W > -20);

      // Score: one point when the witch passes the middle of a pillar pair
      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W / 2 < witch.x) { p.scored = true; score++; scorePop = 1; }
      }

      if (Math.random() < 0.6 * dt) { const b = broomTail(); spark(b.x, b.y, rand(-2, -0.5), rand(-0.5, 0.5)); }

      if (witch.y + witch.r >= GROUND) die();
      else {
        for (const p of pipes) {
          if (hitRect(p.x, -50, PIPE_W, p.top + 50) || hitRect(p.x, p.top + GAP, PIPE_W, GROUND - p.top - GAP)) { die(); break; }
        }
      }
    } else {
      witch.vy = Math.min(witch.vy + GRAVITY * dt, MAX_FALL);
      witch.y += witch.vy * dt;
      if (witch.y + witch.r > GROUND) { witch.y = GROUND - witch.r; witch.vy = 0; }
      witch.angle += (1.3 - witch.angle) * Math.min(1, 0.1 * dt);
    }

    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.03 * dt; p.life += dt; });
    particles = particles.filter(p => p.life < p.max);
    scorePop = Math.max(0, scorePop - 0.06 * dt);
    flash = Math.max(0, flash - 0.05 * dt);
    shake = Math.max(0, shake - 0.6 * dt);
  }

  // ---------- Drawing helpers ----------
  function drawPumpkin(cx, cy, w, h, lit, seed) {
    const rx = w / 2, ry = h / 2;
    if (lit) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.95);
      g.addColorStop(0, 'rgba(255,170,40,0.3)');
      g.addColorStop(1, 'rgba(255,170,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, w * 0.95, 0, TAU); ctx.fill();
    }
    // stem
    ctx.fillStyle = '#4a6b1f';
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.1, cy - ry * 0.8);
    ctx.quadraticCurveTo(cx - rx * 0.05, cy - ry * 1.25, cx + rx * 0.2, cy - ry * 1.3);
    ctx.lineTo(cx + rx * 0.12, cy - ry * 0.8);
    ctx.closePath(); ctx.fill();
    // body
    const grad = ctx.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, ry * 0.1, cx, cy, rx * 1.1);
    grad.addColorStop(0, '#ffb04a');
    grad.addColorStop(0.6, '#f0730f');
    grad.addColorStop(1, '#a8420a');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(cx - rx * 0.42, cy, rx * 0.58, ry, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + rx * 0.42, cy, rx * 0.58, ry, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.55, ry * 1.02, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,40,0,0.45)';
    ctx.lineWidth = Math.max(1, w * 0.03);
    ctx.stroke();
    if (!lit) return;
    // carved face
    const flick = 0.82 + 0.18 * Math.sin(t * 0.3 + seed * 20);
    ctx.save();
    ctx.globalAlpha = flick;
    ctx.fillStyle = '#ffd54a';
    const eye = (x, y, s) => { ctx.moveTo(x - s, y + s * 0.6); ctx.lineTo(x, y - s * 0.8); ctx.lineTo(x + s, y + s * 0.6); ctx.closePath(); };
    ctx.beginPath();
    eye(cx - rx * 0.33, cy - ry * 0.12, rx * 0.2);
    eye(cx + rx * 0.33, cy - ry * 0.12, rx * 0.2);
    ctx.fill();
    const mw = rx * 0.55, my = cy + ry * 0.28;
    ctx.beginPath();
    ctx.moveTo(cx - mw, my - ry * 0.1);
    ctx.quadraticCurveTo(cx, my + ry * 0.55, cx + mw, my - ry * 0.1);
    ctx.lineTo(cx + mw * 0.5, my + ry * 0.02);
    ctx.lineTo(cx + mw * 0.25, my - ry * 0.1);
    ctx.lineTo(cx, my + ry * 0.05);
    ctx.lineTo(cx - mw * 0.25, my - ry * 0.1);
    ctx.lineTo(cx - mw * 0.5, my + ry * 0.02);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawTrunk(x, y, w, h, seed) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#1c1020');
    g.addColorStop(0.45, '#3d2638');
    g.addColorStop(1, '#140a16');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    // bark grooves
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const gx = x + (0.18 + 0.2 * i) * w;
      ctx.beginPath(); ctx.moveTo(gx, y);
      for (let yy = y; yy <= y + h; yy += 14) ctx.lineTo(gx + Math.sin(yy * 0.05 + seed * 7 + i) * 3, yy);
      ctx.stroke();
    }
    // creeping vine
    ctx.strokeStyle = '#3f7a2a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let yy = y; yy <= y + h; yy += 6) {
      const vx = x + w / 2 + Math.sin(yy * 0.04 + seed * 5) * w * 0.38;
      if (yy === y) ctx.moveTo(vx, yy); else ctx.lineTo(vx, yy);
    }
    ctx.stroke();
    ctx.fillStyle = '#5a9a3a';
    for (let yy = y + 20; yy < y + h; yy += 38) {
      const vx = x + w / 2 + Math.sin(yy * 0.04 + seed * 5) * w * 0.38;
      ctx.beginPath(); ctx.ellipse(vx + 5, yy, 5, 2.6, 0.5, 0, TAU); ctx.fill();
    }
  }

  function drawPipe(p) {
    const bTop = p.top + GAP;
    drawTrunk(p.x, -10, PIPE_W, p.top - CAP_H / 2 + 10, p.seed);
    drawTrunk(p.x, bTop + CAP_H / 2, PIPE_W, GROUND - bTop - CAP_H / 2, p.seed + 0.5);
    drawPumpkin(p.x + PIPE_W / 2, p.top - CAP_H / 2, PIPE_W + 8, CAP_H, true, p.seed);
    drawPumpkin(p.x + PIPE_W / 2, bTop + CAP_H / 2, PIPE_W + 8, CAP_H, true, p.seed + 1);
  }

  function drawBat(b) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(b.s, b.s);
    const f = Math.sin(b.p) * 6;
    ctx.fillStyle = '#120818';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-10, -8 + f, -22, -2 + f);
    ctx.quadraticCurveTo(-16, 0, -14, 4);
    ctx.quadraticCurveTo(-8, 2, 0, 6);
    ctx.quadraticCurveTo(8, 2, 14, 4);
    ctx.quadraticCurveTo(16, 0, 22, -2 + f);
    ctx.quadraticCurveTo(10, -8 + f, 0, 0);
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 4, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawHill(fn, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, fn(x));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#1a0b2e');
    sky.addColorStop(0.5, '#3b1b55');
    sky.addColorStop(0.75, '#7a2e4d');
    sky.addColorStop(0.9, '#d9653b');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    stars.forEach(s => {
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.03 + s.p));
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(7 + s.r * 4)}px Consolas, 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.ch, s.x, s.y);
    });
    ctx.globalAlpha = 1;

    const mg = ctx.createRadialGradient(312, 105, 30, 312, 105, 125);
    mg.addColorStop(0, 'rgba(255,236,190,0.4)');
    mg.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(312, 105, 125, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff1cf';
    ctx.beginPath(); ctx.arc(312, 105, 38, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(214,190,150,0.55)';
    [[300, 95, 7], [325, 115, 5], [318, 90, 3.5], [298, 118, 4]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); });

    bats.forEach(drawBat);

    drawHill(farHill, '#2a1640');
    const fog = ctx.createLinearGradient(0, 380, 0, 520);
    fog.addColorStop(0, 'rgba(210,180,255,0)');
    fog.addColorStop(0.5, 'rgba(210,180,255,0.13)');
    fog.addColorStop(1, 'rgba(210,180,255,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 380, W, 140);
    drawHill(nearHill, '#1b0d29');

    const mo = nearOff % MID_TILE;
    for (const p of midPumpkins) {
      for (let k = 0; k < 2; k++) {
        const sx = p.x - mo + k * MID_TILE;
        if (sx < -40 || sx > W + 40) continue;
        const w = 34 * p.s, h = 26 * p.s;
        drawPumpkin(sx, nearHill(sx) + h * 0.15, w, h, p.lit, p.x);
      }
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#2b1a12');
    g.addColorStop(1, '#120906');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    // grassy edge
    ctx.fillStyle = '#25401c';
    ctx.beginPath(); ctx.moveTo(0, GROUND + 10);
    for (let x = 0; x <= W; x += 6) ctx.lineTo(x, GROUND - 2 + Math.sin((x + groundOff) * 0.15) * 2.5);
    ctx.lineTo(W, GROUND + 10); ctx.closePath(); ctx.fill();
    // foreground pumpkins
    const fo = groundOff % FG_TILE;
    for (const p of fgPumpkins) {
      for (let k = 0; k < 2; k++) {
        const sx = p.x - fo + k * FG_TILE;
        if (sx < -40 || sx > W + 40) continue;
        drawPumpkin(sx, GROUND + 22, 44 * p.s, 32 * p.s, p.lit, p.x + 3);
      }
    }
  }

  function drawWitch() {
    ctx.save();
    ctx.translate(witch.x, witch.y);
    ctx.rotate(witch.angle);
    const fl = Math.sin(t * 0.35);

    // soft aura so she reads against the night sky
    const aura = ctx.createRadialGradient(0, -4, 4, 0, -4, 38);
    aura.addColorStop(0, 'rgba(200,150,255,0.28)');
    aura.addColorStop(1, 'rgba(200,150,255,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, -4, 38, 0, TAU); ctx.fill();

    // cape
    ctx.fillStyle = '#2a0f3d';
    ctx.beginPath();
    ctx.moveTo(-2, -10);
    ctx.quadraticCurveTo(-16, -4 + fl * 3, -25, 4 + fl * 5);
    ctx.quadraticCurveTo(-14, 8, -4, 6);
    ctx.closePath(); ctx.fill();

    // broom bristles
    ctx.fillStyle = '#d9a441';
    ctx.beginPath();
    ctx.moveTo(-18, 7); ctx.lineTo(-37, 0); ctx.lineTo(-39, 9); ctx.lineTo(-37, 18); ctx.lineTo(-18, 11);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9c6b1f'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-19, 9); ctx.lineTo(-37, 4);
    ctx.moveTo(-19, 9); ctx.lineTo(-38, 9);
    ctx.moveTo(-19, 9); ctx.lineTo(-37, 14);
    ctx.stroke();
    ctx.fillStyle = '#7a3db8';
    ctx.fillRect(-21, 5.5, 4, 7);

    // handle
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-18, 9); ctx.lineTo(25, 6); ctx.stroke();

    // dress
    ctx.fillStyle = '#6a2c9e';
    ctx.beginPath();
    ctx.moveTo(-10, 9);
    ctx.quadraticCurveTo(-6, -6, 2, -8);
    ctx.quadraticCurveTo(10, -4, 10, 9);
    ctx.closePath(); ctx.fill();

    // leg and boot
    ctx.strokeStyle = '#1a0a24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(3, 9); ctx.lineTo(6, 16); ctx.stroke();
    ctx.fillStyle = '#1a0a24';
    ctx.beginPath(); ctx.ellipse(8, 17, 3.8, 2, 0.3, 0, TAU); ctx.fill();

    // arm on the broom
    ctx.strokeStyle = '#6a2c9e'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(4, -3); ctx.lineTo(12, 6); ctx.stroke();
    ctx.fillStyle = '#8fd16a';
    ctx.beginPath(); ctx.arc(13, 6, 2.2, 0, TAU); ctx.fill();

    // hair
    ctx.fillStyle = '#e8622c';
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.quadraticCurveTo(-11, -11 + fl * 2, -13, -2 + fl * 2);
    ctx.quadraticCurveTo(-4, -6, -1, -6);
    ctx.closePath(); ctx.fill();

    // head, nose, eye, grin
    ctx.fillStyle = '#8fd16a';
    ctx.beginPath(); ctx.arc(3, -13, 6.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -14.5); ctx.lineTo(14, -11); ctx.lineTo(8, -11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a0a24';
    ctx.beginPath(); ctx.arc(5.5, -14.5, 1.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1a0a24'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(5, -10.5, 2.2, 0.2, Math.PI - 0.6); ctx.stroke();

    // hat
    ctx.fillStyle = '#1a0a24';
    ctx.beginPath(); ctx.ellipse(3, -19, 11.5, 2.6, -0.12, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-4, -19);
    ctx.lineTo(10, -19);
    ctx.quadraticCurveTo(6, -27, 2, -32);
    ctx.quadraticCurveTo(-4, -38, -13, -35 + fl * 1.5);
    ctx.quadraticCurveTo(-5, -32, -2, -27);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9b4dca';
    ctx.beginPath(); ctx.moveTo(-4, -19); ctx.lineTo(10, -19); ctx.lineTo(9, -22.5); ctx.lineTo(-3, -22.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(2, -22.5, 3, 3.5);

    ctx.restore();
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function outlinedText(text, x, y, font, fill, stroke, lw) {
    ctx.font = font;
    ctx.lineJoin = 'round';
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const blink = 0.55 + 0.45 * Math.sin(t * 0.09);

    if (state === 'ready') {
      outlinedText('Witchy Flap', W / 2, 160, `62px ${TITLE_FONT}`, '#ff8a1f', '#1a0a24', 8);
      ctx.globalAlpha = blink;
      outlinedText('Tap, click or press Space', W / 2, 390, `800 18px ${BODY_FONT}`, '#f6e7ff', '#1a0a24', 5);
      ctx.globalAlpha = 1;
      if (best > 0) outlinedText(`Best: ${best}`, W / 2, 420, `800 16px ${BODY_FONT}`, '#ffd54a', '#1a0a24', 5);
    } else if (state === 'playing') {
      const size = Math.round(52 * (1 + scorePop * 0.35));
      outlinedText(String(score), W / 2, 72, `${size}px ${TITLE_FONT}`, '#ffd54a', '#1a0a24', 7);
    } else {
      ctx.fillStyle = 'rgba(10,4,20,0.45)';
      ctx.fillRect(0, 0, W, H);
      roundRect(60, 175, 280, 230, 20);
      ctx.fillStyle = 'rgba(30,14,48,0.94)';
      ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#ff8a1f'; ctx.stroke();

      outlinedText('Game Over', W / 2, 222, `48px ${TITLE_FONT}`, '#ff8a1f', '#1a0a24', 6);
      ctx.fillStyle = '#a995c4';
      ctx.font = `800 15px ${BODY_FONT}`;
      ctx.fillText('Score', 140, 272);
      ctx.fillText('Best', 260, 272);
      outlinedText(String(score), 140, 312, `42px ${TITLE_FONT}`, '#f6e7ff', '#1a0a24', 5);
      outlinedText(String(best), 260, 312, `42px ${TITLE_FONT}`, '#ffd54a', '#1a0a24', 5);
      if (newBest) outlinedText('New best!', W / 2, 348, `800 16px ${BODY_FONT}`, '#9dff6b', '#1a0a24', 4);
      if (performance.now() - overAt > 600) {
        ctx.globalAlpha = blink;
        outlinedText('Tap to fly again', W / 2, 380, `800 17px ${BODY_FONT}`, '#f6e7ff', '#1a0a24', 4);
        ctx.globalAlpha = 1;
      }
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#1a0b2e';
    ctx.fillRect(0, 0, W, H);
    if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawBackground();
    pipes.forEach(drawPipe);
    drawGround();
    drawParticles();
    drawWitch();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawHUD();
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,240,220,${flash * 0.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Loop & input ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / (1000 / 60), 3); // same speed on 60Hz and 120Hz screens
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
